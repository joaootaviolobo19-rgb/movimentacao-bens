<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inventário T.I.{% endblock %} · Inventário T.I.</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-shell">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-pc-display-horizontal"></i></div>
            <div class="brand-text">
                <strong>Inventário T.I.</strong>
                <small>Gestão de Ativos</small>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">Principal</div>
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-grid-1x2"></i> <span>Dashboard</span>
            </a>
            <a href="/bens" class="nav-link {% if request.path.startswith('/bens') %}active{% endif %}">
                <i class="bi bi-list-ul"></i> <span>Bens</span>
            </a>
            <a href="/planilha" class="nav-link {% if request.path.startswith('/planilha') %}active{% endif %}">
                <i class="bi bi-table"></i> <span>Planilha</span>
            </a>
            <a href="/funcionarios" class="nav-link {% if request.path.startswith('/funcionarios') %}active{% endif %}">
                <i class="bi bi-people"></i> <span>Funcionários</span>
            </a>
            <a href="/teia" class="nav-link {% if request.path.startswith('/teia') %}active{% endif %}">
                <i class="bi bi-diagram-3"></i> <span>Teia</span>
            </a>

            <div class="nav-section">Operações</div>
            <a href="/movimentar" class="nav-link {% if request.path.startswith('/movimentar') %}active{% endif %}">
                <i class="bi bi-arrow-left-right"></i> <span>Registrar</span>
            </a>
            <a href="/movimentacoes" class="nav-link {% if request.path.startswith('/movimentacoes') %}active{% endif %}">
                <i class="bi bi-clock-history"></i> <span>Movimentações</span>
            </a>
            <a href="/escanear" class="nav-link {% if request.path.startswith('/escanear') %}active{% endif %}">
                <i class="bi bi-search"></i> <span>Buscar</span>
            </a>
            <a href="/etiquetas" class="nav-link {% if request.path.startswith('/etiquetas') %}active{% endif %}">
                <i class="bi bi-qr-code"></i> <span>Etiquetas</span>
            </a>

            <div class="nav-section">Sistema</div>
            <a href="/configuracoes" class="nav-link {% if request.path.startswith('/configuracoes') %}active{% endif %}">
                <i class="bi bi-gear"></i> <span>Configurações</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-mini">
                <div class="user-avatar">TI</div>
                <div class="user-info">
                    <strong>Administrador</strong>
                    <small>Suporte Técnico</small>
                </div>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="topbar-title">{{ self.title() }}</h1>
            </div>
            <div class="topbar-right">
                <span class="topbar-clock" id="topbarClock"></span>
            </div>
        </header>

        <div class="content">
            {% block content %}{% endblock %}
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
    function tick() {
        const el = document.getElementById('topbarClock');
        if (!el) return;
        const d = new Date();
        el.textContent = d.toLocaleDateString('pt-BR') + ' · ' +
                         d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    }
    tick(); setInterval(tick, 30000);

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebarOverlay');
        sb.classList.toggle('open');
        ov.classList.toggle('show');
    }
    function fecharSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') fecharSidebar();
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
