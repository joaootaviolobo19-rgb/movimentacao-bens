<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{codigo}} · {{titulo}}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  * { font-family: 'Inter', system-ui, sans-serif; }
  body {
    background: #f5f7fa;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .erro-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 48px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .erro-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: #fef2f2;
    color: #dc2626;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 20px;
  }
  .erro-codigo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .erro-titulo {
    font-size: 22px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 10px;
  }
  .erro-mensagem {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .erro-detalhe {
    background: #f1f5f9;
    border-left: 3px solid #94a3b8;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    color: #475569;
    font-family: Consolas, monospace;
    text-align: left;
    margin-bottom: 20px;
    word-break: break-all;
    display: none;
  }
  .erro-detalhe.show { display: block; }
</style>
</head>
<body>
<div class="erro-card">
  <div class="erro-icon"><i class="bi bi-exclamation-triangle"></i></div>
  <div class="erro-codigo">Erro {{codigo}}</div>
  <div class="erro-titulo">{{titulo}}</div>
  <div class="erro-mensagem">{{mensagem}}</div>

  {% if detalhe %}
  <div class="erro-detalhe show">{{detalhe}}</div>
  {% endif %}

  <a href="/" class="btn btn-primary">
    <i class="bi bi-house me-1"></i> Voltar ao Dashboard
  </a>
</div>
</body>
</html>
