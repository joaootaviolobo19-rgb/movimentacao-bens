<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscar Bem · Inventário T.I.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  * { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    background: #f5f7fa;
    color: #0f172a;
    padding: 16px;
    max-width: 640px;
    margin: 0 auto;
  }

  .hero {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
    padding: 24px;
    border-radius: 14px;
    margin-bottom: 16px;
    text-align: center;
  }
  .hero h1 { font-size: 20px; margin: 0 0 6px 0; font-weight: 700; letter-spacing: -0.3px; }
  .hero p { margin: 0; opacity: .75; font-size: 13.5px; }

  .card-custom {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .step-label {
    display: inline-block;
    background: #dbeafe;
    color: #1e40af;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  #busca {
    background: #fff;
    color: #0f172a;
    border: 1px solid #e2e8f0;
    padding: 14px 16px;
    font-size: 16px;
    border-radius: 10px;
    font-family: Consolas, monospace;
    text-transform: uppercase;
    width: 100%;
  }
  #busca::placeholder {
    text-transform: none;
    color: #94a3b8;
    font-family: 'Inter', sans-serif;
  }
  #busca:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    outline: none;
  }

  .resultado-item {
    padding: 14px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .resultado-item:hover {
    background: #fff;
    border-color: #2563eb;
    transform: translateY(-1px);
  }
  .resultado-item .host {
    font-family: Consolas, monospace;
    font-size: 16px;
    color: #2563eb;
    font-weight: 700;
  }
  .resultado-item .sub {
    font-size: 12.5px;
    color: #64748b;
    margin-top: 4px;
  }
  .resultado-item .resp {
    font-size: 13px;
    color: #0f172a;
    margin-top: 6px;
  }

  .sugestoes-vazio {
    text-align: center;
    padding: 24px 12px;
    color: #94a3b8;
    font-size: 13px;
  }

  .voltar-link { color: #64748b; text-decoration: none; font-size: 13px; }
  .voltar-link:hover { color: #2563eb; }

  .dica {
    background: #f1f5f9;
    border-left: 3px solid #2563eb;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    color: #475569;
    margin-top: 16px;
  }
  .dica code {
    background: #e2e8f0;
    padding: 1px 6px;
    border-radius: 3px;
    color: #1e40af;
  }
</style>
</head>
<body>

<div class="hero">
  <h1><i class="bi bi-search"></i> Buscar Bem</h1>
  <p>Digite o hostname, patrimônio ou ID do equipamento</p>
</div>

<div class="card-custom">
  <div class="step-label"><i class="bi bi-keyboard"></i> Busca</div>
  <input id="busca" placeholder="Digite para buscar..." autocomplete="off" autofocus>
  <div id="sugestoes" class="mt-3"></div>

  <div class="dica">
    <strong>Dica:</strong> você pode buscar por <code>hostname</code> (ex: <code>JRH31H4</code>),
    <code>patrimônio</code> (ex: <code>441</code>), <code>ID</code> ou nome do responsável.
  </div>
</div>

<div class="text-center mt-4 mb-3">
  <a href="/" class="voltar-link"><i class="bi bi-arrow-left"></i> Voltar ao sistema</a>
</div>

<script>
const busca = document.getElementById('busca');
const sugestoes = document.getElementById('sugestoes');

let timer;

function limpar() {
  sugestoes.innerHTML = '';
}

busca.addEventListener('input', function() {
  clearTimeout(timer);
  const q = this.value.trim();

  if (q.length < 2) { limpar(); return; }

  sugestoes.innerHTML = '<div class="sugestoes-vazio"><i class="bi bi-hourglass-split"></i> Buscando...</div>';

  timer = setTimeout(async () => {
    try {
      const r = await fetch('/api/sugerir?q=' + encodeURIComponent(q));
      const j = await r.json();

      if (!j.bens.length) {
        sugestoes.innerHTML = '<div class="sugestoes-vazio"><i class="bi bi-inbox"></i><br>Nenhum bem encontrado.</div>';
        return;
      }

      sugestoes.innerHTML = j.bens.map(b => {
        const chave = b.hostname || b.patrimonio || b.id;
        const linha2 = [b.categoria, b.modelo].filter(Boolean).join(' · ');
        const linha3 = (b.responsavel || 'SEM RESPONSÁVEL') +
                       (b.departamento ? ' · ' + b.departamento : '');
        return `
          <div class="resultado-item" onclick="location.href='/b/${encodeURIComponent(chave)}'">
            <div class="host">
              ${b.hostname || '(sem hostname)'}
              ${b.patrimonio ? ' · ' + b.patrimonio : ''}
            </div>
            ${linha2 ? `<div class="sub">${linha2}</div>` : ''}
            <div class="resp"><i class="bi bi-person"></i> ${linha3}</div>
          </div>
        `;
      }).join('');
    } catch (e) {
      sugestoes.innerHTML = '<div class="sugestoes-vazio"><i class="bi bi-exclamation-triangle"></i><br>Erro ao buscar. Tente de novo.</div>';
    }
  }, 200);
});
</script>

</body>
</html>
