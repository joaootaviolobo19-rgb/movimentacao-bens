<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Inventário T.I.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a4a 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1a2a4a, #2d3a5a);
            color: white;
            padding: 35px 20px 25px;
            text-align: center;
        }
        .login-header img { height: 55px; margin-bottom: 14px; }
        .login-header h1 { font-size: 1.5rem; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
        .login-header p { opacity: 0.75; font-size: 0.85rem; margin: 4px 0 0; }
        .login-body { padding: 30px; }
        .form-label { font-weight: 600; color: #1a2a4a; font-size: 0.9rem; margin-bottom: 6px; display: block; }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 15px;
            border: 1px solid #ddd;
            width: 100%;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #1a2a4a;
            box-shadow: 0 0 0 3px rgba(26,42,74,0.15);
            outline: none;
        }
        .btn-login {
            background: linear-gradient(to right, #1a2a4a, #2d3a5a);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,42,74,0.3); }
        .erro {
            background: #fdf3f3;
            color: #842029;
            border-left: 4px solid #e74c3c;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .footer-tip {
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='lateral.png') }}" alt="Logo Record">
            <h1>Inventário T.I.</h1>
            <p>Acesso restrito</p>
        </div>
        <div class="login-body">
            {% if erro %}
                <div class="erro"><i class="fas fa-exclamation-circle me-1"></i>{{ erro }}</div>
            {% endif %}
           <form method="POST">
               <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <div class="mb-3">
                       <label class="form-label">Usuário</label>
                    <input type="text" name="usuario" class="form-control" required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" name="senha" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i> Entrar
                </button>
            </form>
            <div class="footer-tip">Esqueceu a senha? Fale com o TI.</div>
        </div>
    </div>
</body>
</html>
