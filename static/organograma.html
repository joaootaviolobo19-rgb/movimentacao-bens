<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organograma · Record Guaíba</title>
    <style>
        :root { color-scheme: light; font-family: Inter, "Segoe UI", Roboto, system-ui, sans-serif; color: #26364d; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { min-height: 0; padding: clamp(0.65rem, 2vw, 1.5rem); background: #f4f6fa; }
        button { font: inherit; }
        .container { display: flex; width: 100%; max-width: 1600px; height: 100%; min-height: 0; flex-direction: column; margin: 0 auto; padding: clamp(1rem, 2vw, 1.75rem); overflow: hidden; background: #fff; border: 1px solid #e4e9f0; border-radius: 14px; box-shadow: 0 8px 24px rgba(25, 42, 74, 0.06); }
        .header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding-bottom: 1rem; border-bottom: 1px solid #e5eaf1; }
        .logo-area { display: flex; align-items: center; gap: 0.8rem; }
        .logo-box { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: #1a2a4a; }
        .logo-box span { color: #fff; font-size: 1.2rem; font-weight: 700; }
        .logo-text h1 { color: #1a2a4a; font-size: 1.3rem; font-weight: 650; }
        .logo-text small { display: block; margin-top: 0.15rem; color: #718096; font-size: 0.62rem; letter-spacing: 1.2px; text-transform: uppercase; }
        .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; }
        .stats { padding: 0.45rem 0.75rem; border: 1px solid #e1e7ef; border-radius: 8px; color: #526178; background: #f8fafc; font-size: 0.8rem; }
        .tool-button { min-height: 36px; padding: 0.45rem 0.75rem; border: 1px solid #d9e0ea; border-radius: 8px; background: #fff; color: #34445c; cursor: pointer; transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease; }
        .tool-button:hover { border-color: #aab8ca; background: #f6f8fb; }
        .tool-button.primary { border-color: #1a2a4a; background: #1a2a4a; color: #fff; }
        .tool-button.primary:hover { background: #263d67; }
        .org-tree { width: 100%; min-width: 0; min-height: 0; flex: 1; padding: 1.5rem 0 0.5rem; overflow: auto; }
        .root-node { display: flex; width: 100%; min-width: 0; flex-direction: column; align-items: center; }
        .node { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 0.25rem 0; }
        .node-card { position: relative; display: flex; min-width: 170px; max-width: 230px; min-height: 68px; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem; padding: 0.75rem 1rem; border: 1px solid #dbe3ed; border-left: 3px solid #7389aa; border-radius: 9px; background: #fff; box-shadow: 0 2px 7px rgba(28, 45, 72, 0.05); text-align: center; cursor: pointer; transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; }
        .node-card:hover { transform: translateY(-2px); border-color: #aabbd2; box-shadow: 0 6px 16px rgba(26, 42, 74, 0.1); }
        .node-card:focus-visible { outline: 3px solid rgba(59, 130, 246, 0.35); outline-offset: 2px; }
        .node-card .icon { position: absolute; top: 5px; right: 6px; color: #718096; font-size: 0.75rem; }
        .node-card .label { display: flex; flex-direction: column; align-items: center; gap: 0.22rem; }
        .node-card .label .cargo { color: #566780; font-size: 0.72rem; }
        .node-card .label .nome { color: #1a2a4a; font-size: 0.86rem; font-weight: 650; }
        .node-card .label .depto { padding: 0.12rem 0.4rem; border-radius: 5px; background: #f1f4f8; color: #62738b; font-size: 0.6rem; letter-spacing: 0.3px; text-transform: uppercase; }
        .level-0 > .node-card { min-width: 210px; border-left-color: #1a2a4a; background: #f2f5fb; }
        .level-1 > .node-card { border-left-color: #355b91; }
        .children-wrap { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 360ms ease, opacity 220ms ease; }
        .children-wrap.open { max-height: 100000px; opacity: 1; padding-top: 0.85rem; overflow: visible; }
        .children-grid { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.65rem 0.9rem; }
        .children-grid > .node { width: auto; min-width: 170px; max-width: 230px; }
        .empty, .load-error { padding: 2.5rem 1rem; color: #65758c; text-align: center; }
        .load-error { color: #a1262d; }
        @media (max-width: 640px) {
            .container { padding: 0.9rem; }
            .header { align-items: flex-start; }
            .toolbar { justify-content: flex-start; }
            .node-card, .children-grid > .node { min-width: 145px; max-width: 190px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
        @page { size: A4 landscape; margin: 8mm; }
        @media print {
            html, body { height: auto; overflow: visible; }
            body { min-height: 0; padding: 0; background: #fff; }
            .container { display: block; max-width: none; height: auto; min-height: 0; padding: 0; overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
            .header { margin-bottom: 4mm; padding-bottom: 2mm; border-bottom: 1px solid #9aa8bb; }
            .toolbar { display: none; }
            .logo-box { width: 10mm; height: 10mm; border-radius: 2mm; }
            .logo-box span { font-size: 12pt; }
            .logo-text h1 { font-size: 13pt; }
            .logo-text small { font-size: 6pt; }
            .org-tree { height: auto; padding: 1mm 0; overflow: visible; }
            .root-node, .node, .children-wrap, .children-wrap.open { max-height: none !important; min-width: 0; overflow: visible !important; opacity: 1 !important; }
            .children-wrap.open { padding-top: 2mm; }
            .children-grid { gap: 2mm 2.5mm; }
            .children-grid > .node { min-width: 30mm; max-width: 42mm; }
            .node { break-inside: avoid; page-break-inside: avoid; }
            .node-card { width: 38mm; min-width: 30mm; max-width: 42mm; min-height: 13mm; padding: 1.5mm; border-radius: 1.5mm; box-shadow: none; cursor: default; }
            .node-card .icon { top: 1mm; right: 1.5mm; }
            .node-card .label { gap: 0.5mm; }
            .node-card .label .nome { font-size: 7pt; }
            .node-card .label .cargo { font-size: 6pt; }
            .node-card .label .depto { padding: 0.3mm 1mm; font-size: 5pt; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-box"><span>RG</span></div>
            <div class="logo-text">
                <h1>Record Guaíba</h1>
                <small>organograma hierárquico</small>
            </div>
        </div>
        <div class="toolbar">
            <div class="stats">Colaboradores: <strong id="totalCount">0</strong></div>
            <button class="tool-button" id="expandAllBtn" type="button">Expandir níveis</button>
            <button class="tool-button" id="collapseAllBtn" type="button">Recolher níveis</button>
            <button class="tool-button primary" id="exportPdfBtn" type="button">Exportar PDF</button>
        </div>
    </div>
    <div class="org-tree" id="orgTree">
        <div style="text-align:center;padding:3rem;color:rgba(26,42,74,0.2);">Carregando organograma...</div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://sptokglrqlhggjzrjrer.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwdG9rZ2xycWxoZ2dqenJqcmVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0MjI4OTUsImV4cCI6MjA4MTk5ODg5NX0.M9tW5sLJgMeWhi8HNTTQIR1IqLFOJp9aBLrluUC_Efo';

    async function load() {
        const r = await fetch(supabaseUrl + '/rest/v1/colaboradores?select=*', {
            headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey }
        });
        if (!r.ok) throw new Error(`Falha na consulta (${r.status}).`);
        return await r.json();
    }

    function buildTree(data) {
        if (!data || !data.length) return null;
        const map = {};
        data.forEach(i => map[i.id] = { ...i, children: [] });
        const roots = [];
        data.forEach(i => {
            if (i.supervisor_id && map[i.supervisor_id]) map[i.supervisor_id].children.push(map[i.id]);
            else roots.push(map[i.id]);
        });
        if (roots.length === 1) return roots[0];
        return { id: 'root', nome: 'Record Guaíba', cargo: 'Organograma', depto: 'Diretoria', children: roots };
    }

    const cargosExibemNome = ['Diretor Executivo','Diretor Institucional','Diretor Comercial','Diretor Administrativo','Diretor de Programação','Diretor','Gerente Financeiro','Gerente de Recursos Humanos','Gerente de Jornalismo','Gerente de Operações e Engenharia','Supervisor de T.I.','Supervisora Comercial','Supervisor de Operações','Coordenador de OPEC','Coordenador Contábil','Coordenadora de Controladoria','Coordenador de Marketing','Coordenador'];
    const controlesNos = [];

    function setExpanded(controle, aberto) {
        controle.wrap.classList.toggle('open', aberto);
        controle.icon.textContent = aberto ? '−' : '+';
        controle.card.setAttribute('aria-expanded', String(aberto));
    }

    function setTodosExpandidos(expandir) {
        controlesNos.forEach(controle => {
            setExpanded(controle, expandir || controle.level === 0);
        });
    }

    function render(node, parent, level) {
        const div = document.createElement('div');
        div.className = 'node level-' + Math.min(level, 4);
        const card = document.createElement('div');
        card.className = 'node-card';
        const hasChildren = node.children && node.children.length > 0;
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = hasChildren ? (level === 0 ? '−' : '+') : '';
        icon.setAttribute('aria-hidden', 'true');
        card.appendChild(icon);
        const label = document.createElement('span');
        label.className = 'label';
        const addLabel = (classe, valor) => {
            if (!valor) return;
            const texto = document.createElement('span');
            texto.className = classe;
            texto.textContent = valor;
            label.appendChild(texto);
        };
        if (cargosExibemNome.includes(node.cargo)) addLabel('nome', node.nome);
        addLabel('cargo', node.cargo);
        addLabel('depto', node.depto);
        card.appendChild(label);
        div.appendChild(card);
        const wrap = document.createElement('div');
        wrap.className = 'children-wrap';
        if (hasChildren) {
            const grid = document.createElement('div');
            grid.className = 'children-grid';
            node.children.forEach(c => render(c, grid, level + 1));
            wrap.appendChild(grid);
            const controle = { card, icon, wrap, level };
            controlesNos.push(controle);
            setExpanded(controle, level === 0);
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            const toggleChildren = () => {
                setExpanded(controle, !wrap.classList.contains('open'));
            };
            card.addEventListener('click', e => {
                e.stopPropagation();
                toggleChildren();
            });
            card.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleChildren();
                }
            });
        }
        div.appendChild(wrap);
        parent.appendChild(div);
    }

    (async () => {
        try {
            const data = await load();
            if (!Array.isArray(data)) throw new Error('A resposta de colaboradores é inválida.');
            const tree = buildTree(data);
            const container = document.getElementById('orgTree');
            container.replaceChildren();
            if (tree) {
                const root = document.createElement('div');
                root.className = 'root-node';
                container.appendChild(root);
                render(tree, root, 0);
            } else {
                container.textContent = 'Nenhum colaborador encontrado.';
                container.classList.add('empty');
            }
            document.getElementById('totalCount').textContent = data.length;
        } catch (e) {
            const container = document.getElementById('orgTree');
            container.textContent = `Não foi possível carregar o organograma. ${e.message}`;
            container.classList.add('load-error');
        }
    })();

    document.getElementById('exportPdfBtn').addEventListener('click', () => window.print());
    document.getElementById('expandAllBtn').addEventListener('click', () => setTodosExpandidos(true));
    document.getElementById('collapseAllBtn').addEventListener('click', () => setTodosExpandidos(false));
    const expansaoAntesDaImpressao = new Map();
    window.addEventListener('beforeprint', () => {
        expansaoAntesDaImpressao.clear();
        controlesNos.forEach(controle => {
            expansaoAntesDaImpressao.set(controle, controle.wrap.classList.contains('open'));
        });
        setTodosExpandidos(true);
    });
    window.addEventListener('afterprint', () => {
        expansaoAntesDaImpressao.forEach((aberto, controle) => setExpanded(controle, aberto));
    });
</script>
</body>
</html>
